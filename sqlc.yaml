version: "2"
sql:
    - engine: "postgresql"
      queries:
          - "./internal/auth/repository.sql"
          - "./internal/channel/repository.sql"
          - "./internal/tenant/repository.sql"
      schema: "migrations/"
      gen:
          go:
              package: "db"
              out: "./internal/provider/db"
              sql_package: "pgx/v5"
              output_db_file_name: "gen_db.go"
              output_models_file_name: "gen_models.go"
              overrides:
                  - db_type: "text"
                    nullable: true
                    go_type:
                        type: "string"
                        pointer: true

                  - db_type: "varchar"
                    nullable: true
                    go_type:
                        type: "string"
                        pointer: true

                  - db_type: "timestamptz"
                    go_type: "time.Time"

                  - db_type: "timestamp"
                    go_type: "time.Time"

                  - db_type: "timestamptz"
                    nullable: true
                    go_type:
                        import: "time"
                        type: "Time"
                        pointer: true

                  - db_type: "timestamp"
                    nullable: true
                    go_type:
                        import: "time"
                        type: "Time"
                        pointer: true

                  - db_type: "uuid"
                    go_type:
                        import: "uuid"
                        type: "UUID"

                  - db_type: "uuid"
                    nullable: true
                    go_type:
                        import: "uuid"
                        type: "UUID"
                        pointer: true

                  - column: "memberships.role"
                    go_type:
                        import: "mimokocke/internal/shared/permissions"
                        type: "MembershipRole"

                  - column: "memberships.permissions"
                    go_type:
                        import: "mimokocke/internal/shared/permissions"
                        type: "MembershipPermission"
                        slice: true

                  - column: "memberships.status"
                    go_type:
                        type: "MembershipStatus"

                  - column: "invitations.role"
                    go_type:
                        import: "mimokocke/internal/shared/permissions"
                        type: "MembershipRole"

                  - column: "invitations.permissions"
                    go_type:
                        import: "mimokocke/internal/shared/permissions"
                        type: "MembershipPermission"
                        slice: true

                  - column: "channels.provider"
                    go_type:
                        type: "ChannelProvider"

                  - column: "channels.status"
                    go_type:
                        type: "ChannelStatus"
