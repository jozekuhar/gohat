version: "2"
sql:
    - engine: "postgresql"
      queries:
          - "./internal/tenant/queries.sql"
          - "./internal/auth/queries.sql"
      schema: "migrations/"
      gen:
          go:
              package: "db"
              out: "./internal/provider/db"
              sql_package: "pgx/v5"
              overrides:
                  - db_type: uuid
                    go_type:
                        import: "uuid"
                        type: "UUID"
